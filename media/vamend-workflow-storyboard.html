<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vamend workflow film</title>
  <style>
    html,body{margin:0;background:#0a0a0b;overflow:hidden}canvas{display:block;width:1920px;height:1080px}
  </style>
</head>
<body>
<canvas id="film" width="1920" height="1080"></canvas>
<script>
const c=document.getElementById('film'),x=c.getContext('2d');
const W=c.width,H=c.height,ORANGE='#ff5a00',INK='#0b0b0c',CREAM='#f4eee7',MUTED='#a7a19b',RED='#ff3d2e';
const logo=new Image(); logo.src='../vamend-site/assets/vamend-logo.png';
window.ready=false; logo.onload=()=>window.ready=true;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const sm=v=>{v=clamp(v);return v*v*(3-2*v)};
const out=v=>1-Math.pow(1-clamp(v),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const alpha=(a,fn)=>{x.save();x.globalAlpha=a;fn();x.restore()};
function rr(px,py,w,h,r,fill,stroke){x.beginPath();x.roundRect(px,py,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=2;x.stroke()}}
function text(s,px,py,size=32,color=CREAM,weight=500,align='left',family='Arial'){x.fillStyle=color;x.font=`${weight} ${size}px ${family}`;x.textAlign=align;x.textBaseline='alphabetic';x.fillText(s,px,py)}
function mono(s,px,py,size=18,color=MUTED,align='left'){text(s,px,py,size,color,600,align,'Consolas')}
function line(x1,y1,x2,y2,color='#29292c',w=2){x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.strokeStyle=color;x.lineWidth=w;x.stroke()}
function token(px,py,r,label,color=ORANGE){x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fillStyle=color;x.fill();text(label,px,py+r*.28,r*.85,INK,800,'center')}
function background(t){
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#09090a');g.addColorStop(.55,'#101012');g.addColorStop(1,'#080809');x.fillStyle=g;x.fillRect(0,0,W,H);
  const glow=x.createRadialGradient(1500+Math.sin(t*.4)*100,160,20,1500,160,850);glow.addColorStop(0,'rgba(255,90,0,.17)');glow.addColorStop(1,'rgba(255,90,0,0)');x.fillStyle=glow;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.12;x.strokeStyle='#555158';x.lineWidth=1;const off=(t*18)%64;for(let i=-H;i<W;i+=64){line(i+off,0,i-H+off,H,'#4c484d',1)}for(let i=0;i<W+H;i+=64){line(i-off,0,i+H-off,H,'#242326',1)}x.restore();
  mono('VAMEND / WORKFLOW',72,72,18,'#777176');mono('SOLANA MAINNET',W-72,72,18,'#777176','right');
}
function progress(t){const p=clamp(t/28);x.fillStyle='#232326';x.fillRect(72,H-54,W-144,3);x.fillStyle=ORANGE;x.fillRect(72,H-54,(W-144)*p,3);mono(String(Math.min(6,Math.floor(t/4)+1)).padStart(2,'0')+' / 06',W-72,H-28,15,'#767176','right')}
function sceneTitle(kicker,headline,body,a){alpha(a,()=>{mono(kicker,96,176,18,ORANGE);text(headline,96,270,72,CREAM,750);text(body,98,330,25,MUTED,400)})}
function logoScene(t){const a=sm(t/.8)*sm((3-t)/.55);const s=lerp(.84,1,out(t/2.4));alpha(a,()=>{
  x.save();x.translate(W/2,H/2-70);x.scale(s,s);x.beginPath();x.roundRect(-210,-210,420,420,54);x.clip();x.drawImage(logo,-210,-210,420,420);x.restore();
  mono('VAMPIRE PROTECTION FOR MEMECOINS',W/2,760,20,ORANGE,'center');text('Same name. Every launch.',W/2,838,58,CREAM,750,'center');text('No place to hide.',W/2,902,58,ORANGE,750,'center');
})}
function groupScene(t){const q=t-3,a=sm(q/.55)*sm((7-t)/.5);sceneTitle('01 / GROUP', 'One meme. One market.', 'Every same-name launch lands on the same comparison page.',a);
  alpha(a,()=>{const targetX=1390;[0,1,2].forEach((i)=>{const fly=out(clamp((q-i*.16)/1.5));const sx=880+i*210,sy=470+(i%2)*210;const px=lerp(sx,targetX,fly),py=lerp(sy,600+i*108-108,fly);rr(px-110,py-76,220,152,24,'#171719','#353237');token(px-60,py-20,27,'M',i===2?'#67616a':ORANGE);text('$MOON',px-18,py-12,25,CREAM,750);mono(`DEV 0${i+1}`,px-60,py+38,14,MUTED);});
  const boxA=sm((q-1.4)/.55);alpha(boxA,()=>{rr(1180,415,440,390,36,'rgba(255,90,0,.055)',ORANGE);mono('SAME-NAME MARKET',1220,462,15,ORANGE);text('$MOON',1220,520,42,CREAM,800);line(1220,548,1580,548,'#3a3432');text('3 launches',1220,755,22,MUTED,500)})})}
function compareScene(t){const q=t-7,a=sm(q/.5)*sm((11-t)/.5);sceneTitle('02 / COMPARE','Developers, side by side.','Lock size, options and behavior become visible before liquidity moves.',a);
  alpha(a,()=>{const rise=26*(1-out(q/.7));rr(780,390+rise,1040,480,34,'#141416','#333136');
    const cols=[820,1160,1390,1590];['DEVELOPER','SUPPLY LOCK','OPTIONS','STATUS'].forEach((v,i)=>mono(v,cols[i],448+rise,15,'#817a7e'));
    [['A','10%','LIVE','PROTECTED'],['B','4%','LIVE','PROTECTED'],['C','0%','—','UNPROTECTED']].forEach((r,j)=>{const y=540+j*105+rise;line(820,y-45,1775,y-45,'#29272a');token(850,y,25,r[0],j===2?'#38353a':ORANGE);text(`Developer ${r[0]}`,900,y+8,23,CREAM,650);text(r[1],1160,y+8,25,j===2?'#817a7e':ORANGE,750);text(r[2],1390,y+8,22,CREAM,600);rr(1580,y-24,172,46,23,j===2?'#27252a':'rgba(255,90,0,.13)',j===2?'#454149':ORANGE);mono(r[3],1666,y+6,13,j===2?'#9b959a':ORANGE,'center')})})}
function lockScene(t){const q=t-11,a=sm(q/.5)*sm((15-t)/.5);sceneTitle('03 / LOCK','Put supply behind conviction.','Developers commit 2%–10% of supply to a program-controlled vault.',a);
  alpha(a,()=>{const cx=1330,cy=620;x.beginPath();x.arc(cx,cy,240,0,Math.PI*2);x.strokeStyle='#2d2b2e';x.lineWidth=36;x.stroke();const p=clamp(q/2.2);x.beginPath();x.arc(cx,cy,240,-Math.PI/2,-Math.PI/2+Math.PI*2*p);x.strokeStyle=ORANGE;x.lineCap='round';x.lineWidth=36;x.stroke();
    const lock=lerp(2,10,out(q/2.2));text(`${lock.toFixed(0)}%`,cx,cy+14,92,CREAM,800,'center');mono('SUPPLY LOCKED',cx,cy+62,17,ORANGE,'center');
    rr(865,478,230,285,30,'#151517','#39353a');mono('DEVELOPER',900,525,15,MUTED);token(980,615,52,'D');text('SUPPLY',980,716,20,CREAM,700,'center');
    const arrow=sm((q-.8)/.7);line(1095,620,1175,620,`rgba(255,90,0,${arrow})`,5);for(let i=0;i<3;i++){const px=lerp(1080,1210,clamp(q/2-i*.16));token(px,590+i*30,10,'',ORANGE)}
  })}
function optionScene(t){const q=t-15,a=sm(q/.5)*sm((19-t)/.5);sceneTitle('04 / OPTIONS','Protection has a price.','Premium is 10% of strike. Exercise above strike before expiry.',a);
  alpha(a,()=>{const baseY=770;line(820,baseY,1780,baseY,'#3a373b',3);[.5,1,2].forEach((v,i)=>{const px=960+i*330;line(px,baseY-210,px,baseY,'#343136',2);rr(px-120,470,240,170,26,i===1?'rgba(255,90,0,.13)':'#151517',i===1?ORANGE:'#39363a');mono('STRIKE',px,515,14,MUTED,'center');text(`${v.toFixed(2)} SOL`,px,564,30,CREAM,750,'center');text(`Premium ${(v*.1).toFixed(2)} SOL`,px,608,17,i===1?ORANGE:MUTED,600,'center');token(px,baseY,16,'',i===1?ORANGE:'#5a555b')});
    const px=lerp(960,1620,out(q/2.5));token(px,705,28,'↑',ORANGE);mono('MARKET PRICE',px,674,14,ORANGE,'center');
  })}
function forfeitScene(t){const q=t-19,a=sm(q/.45)*sm((23-t)/.5);sceneTitle('05 / ENFORCE','Sell early. Lose the lock.','An oracle-attested violation moves remaining supply to option holders.',a);
  alpha(a,()=>{rr(800,420,350,330,34,'#151517','#3a363b');mono('DEVELOPER WALLET',840,468,15,MUTED);token(975,575,62,'D');const warn=sm((q-.6)/.35);alpha(warn,()=>{rr(845,680,260,52,26,'rgba(255,61,46,.14)',RED);mono('EARLY SALE DETECTED',975,713,14,RED,'center')});
    const hit=sm((q-1.15)/.55);line(1150,585,1380,585,`rgba(255,90,0,${hit})`,6);text('→',1265,608,58,ORANGE,800,'center');rr(1380,420,410,330,34,'rgba(255,90,0,.06)',ORANGE);mono('FORFEITURE CLAIMS',1420,468,15,ORANGE);[0,1,2].forEach(i=>{token(1480+i*110,585,38,String(i+1),CREAM);mono('HOLDER',1480+i*110,654,12,MUTED,'center')});mono('LOCK DISTRIBUTED PRO RATA',1585,708,14,CREAM,'center')
  })}
function finalScene(t){const q=t-23,a=sm(q/.7)*sm((28-t)/.75);alpha(a,()=>{
  x.save();x.beginPath();x.roundRect(118,120,410,410,54);x.clip();x.drawImage(logo,118,120,410,410);x.restore();
  mono('VAMEND',640,218,20,ORANGE);text('One meme.',640,332,88,CREAM,800);text('Comparable developers.',640,430,88,CREAM,800);text('Visible commitments. Enforceable consequences.',644,505,27,MUTED,450);
  rr(642,604,430,72,36,ORANGE);text('Explore Vamend',857,652,23,INK,750,'center');mono('@VAMENDLAUNCH',642,744,18,CREAM);mono('SOLANA MAINNET INTERFACE',642,786,15,MUTED);
  const sweep=out(q/4);line(640,860,lerp(640,1720,sweep),860,ORANGE,4);text('VAMPIRE PROTECTION',1720,922,23,ORANGE,700,'right');
})}
window.render=(t)=>{background(t);if(t<3)logoScene(t);else if(t<7)groupScene(t);else if(t<11)compareScene(t);else if(t<15)lockScene(t);else if(t<19)optionScene(t);else if(t<23)forfeitScene(t);else finalScene(t);progress(t)};
</script>
</body>
</html>
