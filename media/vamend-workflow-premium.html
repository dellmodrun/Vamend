<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Vamend premium workflow</title><style>html,body{margin:0;background:#080809;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c" width="1920" height="1080"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d'),W=1920,H=1080,O='#ff5a00',BG='#09090a',FG='#f5efe9',M='#999398';
const logo=new Image();logo.src='../vamend-site/assets/vamend-logo.png';window.ready=false;logo.onload=()=>window.ready=true;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),sm=v=>{v=cl(v);return v*v*(3-2*v)},out=v=>1-Math.pow(1-cl(v),3),mix=(a,b,t)=>a+(b-a)*t;
function alpha(a,fn){g.save();g.globalAlpha=a;fn();g.restore()}function line(a,b,c,d,col='#333',w=2){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function rr(x,y,w,h,r,fill,stroke,shadow=0){g.save();if(shadow){g.shadowColor='rgba(0,0,0,.65)';g.shadowBlur=shadow;g.shadowOffsetY=16}g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.shadowColor='transparent';g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}g.restore()}
function tx(s,x,y,z=32,col=FG,wt=600,al='left',fam='Segoe UI'){g.fillStyle=col;g.font=`${wt} ${z}px ${fam}`;g.textAlign=al;g.textBaseline='alphabetic';g.fillText(s,x,y)}function mono(s,x,y,z=16,col=M,al='left'){tx(s,x,y,z,col,650,al,'Consolas')}
function coin(x,y,r,s,col=O){g.save();g.shadowColor=col;g.shadowBlur=18;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=col;g.fill();g.restore();tx(s,x,y+r*.3,r*.8,BG,800,'center')}
function bg(t,cam){const q=g.createLinearGradient(0,0,W,H);q.addColorStop(0,'#070708');q.addColorStop(.55,'#111012');q.addColorStop(1,'#070708');g.fillStyle=q;g.fillRect(0,0,W,H);const glow=g.createRadialGradient(1500,180,30,1500,180,900);glow.addColorStop(0,'rgba(255,90,0,.17)');glow.addColorStop(1,'rgba(255,90,0,0)');g.fillStyle=glow;g.fillRect(0,0,W,H);
  g.save();g.globalAlpha=.12;const off=(-cam*.12+t*9)%72;for(let i=-H;i<W+H;i+=72){line(i+off,0,i-H+off,H,'#373438',1);line(i-off,0,i+H-off,H,'#1d1c1f',1)}g.restore();for(let i=0;i<24;i++){const x=(i*397-cam*.06+t*(14+i%5))%(W+160)-80,y=120+(i*211)%800+Math.sin(t+i)*16;alpha(.12,()=>{g.beginPath();g.arc(x,y,1.4+(i%3),0,Math.PI*2);g.fillStyle=i%5===0?O:FG;g.fill()})}}
const stops=[{x:1450,k:'01 / GROUP',h:'One meme. One market.',b:'Every same-name launch enters one shared comparison layer.'},{x:2750,k:'02 / COMPARE',h:'Developers, side by side.',b:'Locks, options and behavior become readable before liquidity moves.'},{x:4050,k:'03 / LOCK',h:'Conviction becomes collateral.',b:'Developers commit 2%–10% of supply to the Vamend vault.'},{x:5350,k:'04 / OPTIONS',h:'Protection has a price.',b:'Premium is 10% of strike. Exercise above strike before expiry.'},{x:6650,k:'05 / ENFORCE',h:'Sell early. Lose the lock.',b:'Verified violations move remaining supply to option holders.'}];
function camera(t){if(t<3)return 350;const times=[3,7,11,15,19,23],xs=[350,1450,2750,4050,5350,6650];for(let i=0;i<times.length-1;i++)if(t<times[i+1]){const p=sm(cl((t-times[i])/1.55));return mix(xs[i],xs[i+1],p)}return 6650}
function headline(t,cam){let best=stops.reduce((a,b)=>Math.abs(b.x-cam)<Math.abs(a.x-cam)?b:a);const a=cl(1-Math.abs(best.x-cam)/900);const dy=(1-out(a))*24;alpha(out(a),()=>{mono(best.k,86,146+dy,17,O);tx(best.h,86,224+dy,62,FG,760);tx(best.b,88,278+dy,23,M,430)})}
function rail(t,cam){g.save();g.translate(W/2-cam,0);line(260,700,7040,700,'#262427',10);line(260,700,7040,700,'rgba(255,90,0,.22)',3);for(const s of stops){g.beginPath();g.arc(s.x,700,12,0,Math.PI*2);g.fillStyle='#161618';g.fill();g.strokeStyle=O;g.lineWidth=3;g.stroke()}const pulse=350+((t-3)*360)%6500;g.save();g.shadowColor=O;g.shadowBlur=34;coin(pulse,700,9,'',O);g.restore();g.restore()}
function group(t,cam){const X=1450,a=cl(1-Math.abs(X-cam)/1150),p=out(cl((t-3.3)/1.5));alpha(a,()=>{g.save();g.translate(W/2-cam,0);rr(X-330,380,660,250,34,'#131315','#3d383d',36);mono('SAME-NAME MARKET',X-285,430,14,O);tx('$MOON',X-285,486,40,FG,800);for(let i=0;i<3;i++){const sx=X-260+i*155,sy=560+Math.sin(t*1.4+i)*6;rr(sx,sy-40,132,76,18,i===2?'#202024':'rgba(255,90,0,.08)',i===2?'#444047':O);coin(sx+30,sy-2,18,'M',i===2?'#68626a':O);mono(`DEV 0${i+1}`,sx+57,sy+4,11,i===2?M:FG)}mono('3 LAUNCHES / 1 NAME',X+285,602,12,M,'right');g.restore()})}
function compare(t,cam){const X=2750,a=cl(1-Math.abs(X-cam)/1150);alpha(a,()=>{g.save();g.translate(W/2-cam,0);rr(X-430,350,860,300,36,'#121214','#3a363b',40);['DEVELOPER','LOCK','OPTIONS','STATUS'].forEach((v,i)=>mono(v,X-380+[0,320,480,650][i],402,12,'#777176'));[['A','10%','LIVE','PROTECTED'],['B','4%','LIVE','PROTECTED'],['C','0%','—','UNPROTECTED']].forEach((r,j)=>{const y=468+j*76;line(X-380,y-35,X+380,y-35,'#2c292d');coin(X-350,y-4,18,r[0],j===2?'#555158':O);tx(`Developer ${r[0]}`,X-318,y+3,18,FG,650);tx(r[1],X-60,y+3,18,j===2?M:O,750);tx(r[2],X+100,y+3,16,FG,600);rr(X+240,y-25,138,38,19,j===2?'#242227':'rgba(255,90,0,.09)',j===2?'#454148':O);mono(r[3],X+309,y,10,j===2?M:O,'center')});const scan=350+((t*150)%300);const q=g.createLinearGradient(0,scan-40,0,scan+40);q.addColorStop(0,'rgba(255,90,0,0)');q.addColorStop(.5,'rgba(255,90,0,.06)');q.addColorStop(1,'rgba(255,90,0,0)');g.fillStyle=q;g.fillRect(X-428,scan,856,60);g.restore()})}
function lock(t,cam){const X=4050,a=cl(1-Math.abs(X-cam)/1150),p=out(cl((t-11.4)/2));alpha(a,()=>{g.save();g.translate(W/2-cam,0);rr(X-420,390,260,230,32,'#131315','#3b373c',32);mono('DEVELOPER SUPPLY',X-380,435,12,M);coin(X-290,515,48,'D');mono('ON-CHAIN',X-290,592,11,FG,'center');line(X-160,515,X-40,515,O,5);for(let i=0;i<4;i++)coin(X-135+i*30,515,7,'');g.beginPath();g.arc(X+185,510,145,0,Math.PI*2);g.strokeStyle='#2d2a2e';g.lineWidth=25;g.stroke();g.beginPath();g.arc(X+185,510,145,-Math.PI/2,-Math.PI/2+Math.PI*2*p);g.strokeStyle=O;g.lineWidth=25;g.lineCap='round';g.shadowColor=O;g.shadowBlur=18;g.stroke();g.shadowColor='transparent';tx(`${mix(2,10,p).toFixed(0)}%`,X+185,530,62,FG,800,'center');mono('PROGRAM VAULT',X+185,574,12,O,'center');g.restore()})}
function options(t,cam){const X=5350,a=cl(1-Math.abs(X-cam)/1150),p=out(cl((t-15.4)/2.2));alpha(a,()=>{g.save();g.translate(W/2-cam,0);line(X-390,620,X+390,620,'#38343a',3);[.5,1,2].forEach((v,i)=>{const px=X-260+i*260;rr(px-100,400,200,150,24,i===1?'rgba(255,90,0,.12)':'#131315',i===1?O:'#3a363b',28);mono('STRIKE',px,442,11,M,'center');tx(`${v.toFixed(2)} SOL`,px,485,25,FG,750,'center');mono(`PREMIUM ${(v*.1).toFixed(2)}`,px,522,11,i===1?O:M,'center');line(px,550,px,620,'#373338',2);coin(px,620,12,'',i===1?O:'#565058')});const px=mix(X-260,X+300,p);coin(px,583,24,'↑');mono('MARKET',px,550,11,O,'center');g.restore()})}
function enforce(t,cam){const X=6650,a=cl(1-Math.abs(X-cam)/1200),p=out(cl((t-19.3)/1.5));alpha(a,()=>{g.save();g.translate(W/2-cam,0);rr(X-430,390,300,230,34,'#131315','#3b373c',34);mono('DEVELOPER WALLET',X-390,432,12,M);coin(X-280,505,46,'D');rr(X-390,560,220,40,20,'rgba(255,61,46,.12)','#ff4438');mono('EARLY SALE DETECTED',X-280,585,11,'#ff5548','center');line(X-130,505,X+85,505,O,6);tx('→',X-22,527,54,O,800,'center');rr(X+85,390,350,230,34,'rgba(255,90,0,.055)',O,34);mono('FORFEITURE CLAIMS',X+125,432,12,O);[0,1,2].forEach(i=>{coin(X+160+i*105,510,32,String(i+1),FG);mono('HOLDER',X+160+i*105,574,10,M,'center')});g.restore()})}
function intro(t){const a=sm(t/.65)*sm((3-t)/.55),z=mix(.88,1,out(t/2));alpha(a,()=>{g.save();g.translate(W/2,H/2-80);g.scale(z,z);g.beginPath();g.roundRect(-185,-185,370,370,48);g.clip();g.drawImage(logo,-185,-185,370,370);g.restore();mono('VAMPIRE PROTECTION FOR MEMECOINS',W/2,735,17,O,'center');tx('One name. Every launch.',W/2,810,50,FG,760,'center');tx('One place to compare.',W/2,870,50,O,760,'center')})}
function outro(t){const a=sm((t-23)/.8);alpha(a,()=>{const shade=g.createLinearGradient(0,0,W,0);shade.addColorStop(0,'rgba(8,8,9,.98)');shade.addColorStop(.75,'rgba(8,8,9,.92)');shade.addColorStop(1,'rgba(8,8,9,.55)');g.fillStyle=shade;g.fillRect(0,0,W,H);g.save();g.beginPath();g.roundRect(120,180,360,360,46);g.clip();g.drawImage(logo,120,180,360,360);g.restore();mono('VAMEND',600,248,18,O);tx('Make developer',600,350,78,FG,780);tx('commitments visible.',600,438,78,FG,780);tx('Same name. Every launch. No place to hide.',604,512,25,M,430);rr(604,615,390,70,35,O);tx('Follow @vamendlaunch',799,661,21,BG,750,'center');mono('SOLANA MAINNET INTERFACE',604,744,14,M)})}
function chrome(t){mono('VAMEND / PROTOCOL FLOW',66,66,15,'#716b70');mono('SOLANA MAINNET',W-66,66,15,'#716b70','right');g.fillStyle='#282529';g.fillRect(66,H-50,W-132,3);g.fillStyle=O;g.fillRect(66,H-50,(W-132)*cl(t/28),3)}
window.render=t=>{const cam=camera(t);bg(t,cam);if(t<3)intro(t);else{rail(t,cam);group(t,cam);compare(t,cam);lock(t,cam);options(t,cam);enforce(t,cam);headline(t,cam)}if(t>=23)outro(t);chrome(t)};
</script></body></html>
