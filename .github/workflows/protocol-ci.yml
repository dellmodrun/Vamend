name: Test Vamend protocol

on:
  push:
    paths:
      - "protocol/**"
      - ".github/workflows/protocol-ci.yml"
  pull_request:
    paths:
      - "protocol/**"
      - ".github/workflows/protocol-ci.yml"

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: protocol
      - run: cargo fmt --all -- --check
      - run: cargo test -p protocol --lib
